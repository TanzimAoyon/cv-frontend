<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahoshin Tanjim Aoyon - CV</title>
    <style>
        /* Professional Document Styling */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e9ecef; 
            color: #333; 
            margin: 0; 
            padding: 40px 20px; 
        }
        
        .cv-document {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 50px 60px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid #2c3e50;
        }

        /* Header Layout */
        .cv-header {
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .cv-header h1 { 
            margin: 0; 
            color: #2c3e50; 
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cv-header p {
            margin: 8px 0 0 0;
            color: #7f8c8d;
            font-size: 1.1em;
        }

        /* Section Styling */
        .cv-section {
            margin-bottom: 30px;
        }
         .cv-section h2 {
            color: #2980b9;
            font-size: 1.4em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: inline-block; /* This forces the border to wrap tightly to the letters */
        }

        /* Entry Styling */
        .cv-entry { 
            display: flex; 
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px; 
            padding-left: 10px;
            position: relative;
        }
        .cv-entry::before {
            content: "•";
            color: #3498db;
            font-weight: bold;
            display: inline-block; 
            width: 1em;
            position: absolute;
            left: -5px;
        }
        .entry-content {
            flex-grow: 1;
            font-size: 1.05em;
            line-height: 1.5;
        }

        /* Footer Layout */
        .cv-footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
            color: #bdc3c7;
            font-size: 0.9em;
        }

        /* Admin Controls & Forms */
        .admin-actions button { 
            background: #f39c12; 
            color: white; 
            border: none; 
            padding: 4px 8px; 
            margin-left: 5px;
            cursor: pointer; 
            border-radius: 3px; 
            font-size: 0.8em;
        }
        .admin-actions button.delete-btn { background: #e74c3c; }
        
        .form-group { 
            margin-top: 40px; 
            background: #f8f9fa; 
            padding: 20px; 
            border: 1px solid #dee2e6;
            border-radius: 5px; 
            display: none; /* Hidden by default */
        }
        .form-group h3 { margin-top: 0; color: #2c3e50; }
        input { 
            padding: 10px; 
            margin-right: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            width: 200px;
        }
        .add-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .admin-toggle {
            display: block;
            margin: 40px auto 0 auto;
            background: transparent;
            color: #bdc3c7;
            border: 1px solid #bdc3c7;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.3s;
        }
        .admin-toggle:hover { background: #bdc3c7; color: white; }
    </style>
</head>
<body>

    <div class="cv-document">
        
        <header class="cv-header">
            <h1>Tahoshin Tanjim Aoyon</h1>
            <p>Computer Science Student | Founder of ReverieInc</p>
        </header>
        
        <main id="cv-container">
            <!-- CV content loaded dynamically from API -->
        </main>

        <!-- Hidden form for adding entries -->
        <div class="form-group" id="add-form">
            <h3>Admin Panel: Add Entry</h3>
            <input type="text" id="section" placeholder="Heading (e.g. Education)">
            <input type="text" id="content" placeholder="Content (e.g. BSc CSE - IUB)">
            <button class="add-btn" onclick="addEntry()">Add to Database</button>
        </div>

        <footer class="cv-footer">
            Generated via REST API & SQLite Database
        </footer>

    </div>

    <!-- Secret Admin Button -->
    <button class="admin-toggle" onclick="toggleAdmin()">Admin Mode</button>

    <script>
        let isAdmin = false;

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('add-form').style.display = 'none';
                loadCV();
                return;
            }

            const password = prompt("Enter Admin Password:");
            if (password === "iub123") {
                isAdmin = true;
                document.getElementById('add-form').style.display = 'block';
                loadCV(); 
            } else if (password !== null) {
                alert("Incorrect password");
            }
        }

        async function loadCV() {
            const res = await fetch('/api/cv');
            const data = await res.json();
            const container = document.getElementById('cv-container');
            container.innerHTML = '';
            
            // Group the data by 'section' heading
            const groupedData = {};
            data.forEach(item => {
                if (!groupedData[item.section]) {
                    groupedData[item.section] = [];
                }
                groupedData[item.section].push(item);
            });

            // Loop through each group and create the HTML structure
            for (const sectionName in groupedData) {
                let sectionHtml = `<div class="cv-section"><h2>${sectionName}</h2>`;
                
                groupedData[sectionName].forEach(item => {
                    const buttonsHtml = isAdmin ? `
                        <div class="admin-actions">
                            <button onclick="updateEntry(${item.id}, '${item.section}')">Edit</button>
                            <button class="delete-btn" onclick="deleteEntry(${item.id})">Delete</button>
                        </div>
                    ` : '';

                    sectionHtml += `
                        <div class="cv-entry">
                            <div class="entry-content">${item.content}</div>
                            ${buttonsHtml}
                        </div>
                    `;
                });

                sectionHtml += `</div>`;
                container.innerHTML += sectionHtml;
            }
        }

        async function addEntry() {
            const section = document.getElementById('section').value;
            const content = document.getElementById('content').value;
            
            if (!section || !content) {
                alert("Please fill in both fields.");
                return;
            }

            // Using fetch to trigger the CREATE logic
            await fetch('/api/cv', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ section, content })
            });
            
            document.getElementById('section').value = '';
            document.getElementById('content').value = '';
            loadCV(); 
        }

        async function updateEntry(id, currentSection) {
            const newContent = prompt("Enter updated content for " + currentSection + ":");
            
            if (newContent !== null && newContent.trim() !== "") {
                // Using fetch to trigger the UPDATE logic
                await fetch(`/api/cv/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ section: currentSection, content: newContent })
                });
                loadCV(); 
            }
        }

        async function deleteEntry(id) {
            if (confirm("Are you sure you want to delete this entry?")) {
                // Using fetch to trigger the DELETE logic
                await fetch(`/api/cv/${id}`, { method: 'DELETE' });
                loadCV(); 
            }
        }

        // Load the CV when the page starts
        loadCV();
    </script>
</body>
</html>
